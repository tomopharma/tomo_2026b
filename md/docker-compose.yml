name: tomo_2026b_md

services:
  md:
    build:
      context: ./container
      dockerfile: Dockerfile
    image: tomo_2026b_md
    container_name: tomo_2026b_md
    ports:
      - "${MD_PORT:-8890}:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
    working_dir: /workspace/notebooks
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --allow-root
      --no-browser
      --NotebookApp.token=''
      --NotebookApp.password=''
      --notebook-dir=/workspace/notebooks
    restart: unless-stopped

  # NVIDIA GPU image: linux/amd64 + CUDA GROMACS. Do not use on Apple Silicon.
  #   docker compose --profile gpu up -d md-gpu
  #   ./up-md.sh --gpu [--build]
  md-gpu:
    profiles: ["gpu"]
    platform: linux/amd64
    build:
      context: ./container
      dockerfile: Dockerfile.gpu
    image: tomo_2026b_md_gpu
    container_name: tomo_2026b_md_gpu
    ports:
      - "${MD_GPU_PORT:-8891}:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
    working_dir: /workspace/notebooks
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --allow-root
      --no-browser
      --NotebookApp.token=''
      --NotebookApp.password=''
      --notebook-dir=/workspace/notebooks
    restart: unless-stopped

