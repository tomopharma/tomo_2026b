# CUDA GROMACS for linux-64 NVIDIA hosts (not Apple Silicon).
# conda-forge build: gromacs-2025.4-nompi_cuda_* (requires CUDA toolkit 12.9).
name: gromacs
channels:
  - conda-forge
  - defaults
dependencies:
  - gromacs=2025.4=nompi_cuda*
  # PROPKA 3.5.1 crashes on Python 3.14 (reads self.__annotations__, changed in 3.14).
  - python=3.12
  - matplotlib
  - nglview=3.1.1
  - mdtraj
  - openmm
  - pdbfixer
  - propka
  - notebook
  - nbconvert
  - numpy
  - requests
  - pandas
  - seaborn
  - compilers
  - openmpi
  - cmake
